# 本地开发 / 参考配置。生产由共享 Worker allworld 托管静态 + R2 SQLite。
# 本站发布仅同步 R2，禁止 wrangler deploy 覆盖共享 Worker。

name = "allworld"
main = "worker/index.js"
compatibility_date = "2026-08-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[r2_buckets]]
binding = "SITES"
bucket_name = "allworld-sites"

[vars]
ROOT_DOMAIN = "softwarelink.net"
