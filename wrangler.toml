name = "allworld"
main = "worker/index.js"
compatibility_date = "2026-08-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 共享多站点入口：通配子域由 allworld 托管；本站点走同 Worker 内主机分流
[[routes]]
pattern = "*.softwarelink.net/*"
zone_name = "softwarelink.net"

[[routes]]
pattern = "26-sd-mr-bid.softwarelink.net"
custom_domain = true

[[routes]]
pattern = "softwarelink.net"
custom_domain = true

[[routes]]
pattern = "www.softwarelink.net"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "Allworld"
database_id = "502e9e5d-e221-480c-a2a8-20c618fe7688"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "26-sd-mr-bid-assets"

[[r2_buckets]]
binding = "SITES"
bucket_name = "allworld-sites"

[vars]
PROJECT_SLUG = "26-sd-mr-bid"
REPO_NAME = "26-sd-mr-bid"
DEPLOYMENT_HOST = "https://26-sd-mr-bid.softwarelink.net/"
HOST_DOMAIN = "https://26-sd-mr-bid.softwarelink.net"
ROOT_DOMAIN = "softwarelink.net"
JWT_SECRET = "sd-mr-bid-demo-jwt-secret-2026"
